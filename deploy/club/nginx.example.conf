# Install on the Docker host after replacing the domain and certificate paths.
# Obtain a valid certificate first; certificate issuance/renewal is host-specific.
server {
    listen 80;
    server_name ctf.example.com;
    return 301 https://ctf.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name ctf.example.com;
    ssl_certificate /etc/letsencrypt/live/ctf.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ctf.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1g;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace any client-supplied chain at this trust boundary.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_read_timeout 90s;
    }
}
